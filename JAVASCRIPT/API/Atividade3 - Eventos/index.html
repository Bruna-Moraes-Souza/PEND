<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>World Events</h1>
    <p>Encontre eventos do mundo</p>
</header>
<main>
    <section class="pesquisa">
        <h2>Pesquisar eventos</h2>
        <input 
            type="text" 
            id="Pesquisa" 
            placeholder="Digite uma cidade..."
        >
        <button id="botaoPesquisar">Pesquisar</button>
    </section>
    <p id="mensagem"></p>
    <section id="listaEventos" class="eventos">
        <!-- Os eventos aparecem aqui -->
    </section>
</main>
<footer>
    <p> World Events - Projeto de Desenvolvimento de Sistemas</p>
</footer>
<script src="script.js"></script>
</body>
</html>
