<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro</title>
</head>

<body>

    <div class="container">
        <h1 id="titulo">Cadastro e Exibir produto </h1>

        <p>Nome:</p><input id="nome" type="text" placeholder="Nome"><br>
        <p>Preço:</p><input id="preco" type="number" placeholder="Preço"><br>
        <p>Categoria:</p><input id="categoria" type="text" placeholder="Categoria"><br>
        <p>Desconto:</p><input id="desconto" type="number" placeholder="Desconto"><br><br>
        <button id="botaoCadastrar">
            Cadastrar
        </button>
    </div>



    <div id="resultado"></div>

    <script src="script.js"></script>


</body>

</html>
