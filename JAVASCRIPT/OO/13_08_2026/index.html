<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
</head>

<body>
    <h1 id="titulo">Cadastro de Produto</h1>

    <label for="nome">Nome:</label>
    <input id="nome" type="text" placeholder="Nome"><br><br>
    <label for="preço">Preço:</label>
    <input id="preço" type="number" placeholder="Preço"><br><br>
    <label for="categoria">Categoria:</label>
    <input id="categoria" type="text" placeholder="Categoria"><br><br>
    <label for="desconto">Desconto:</label>
    <input id="desconto" type="number" placeholder="desconto"><br><br>


    <button id="botaoCadastrar"><br>
        Cadastrar
    </button>

    <div id="resultado"></div>

    <script src="script.js"></script>


</body>

</html>
